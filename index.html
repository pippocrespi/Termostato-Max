<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Termostato</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; }
  input { width: 60px; }
  button { margin-left: 5px; }
</style>
</head>
<body>
<h1>Mini Termostato</h1>

<p>Temperatura attuale: <span id="temp">?</span> °C</p>
<p>Caldaia: <span id="relay">?</span></p>

<h3>Setpoint temperatura:</h3>
<input type="number" id="setpoint" value="22">
<button id="setBtn">Imposta</button>

<script>
const BLYNK_TOKEN = "h5AP59GwzyGagYOX1b1hEGkJyFx87-Qm"; // inserisci il token del tuo device
const BLYNK_URL = `https://blynk.cloud/external/api/`;

// Funzione per leggere temperatura
function getTemp() {
  fetch(`${BLYNK_URL}get?token=${BLYNK_TOKEN}&V2`)
    .then(res => res.text())
    .then(val => {
      document.getElementById("temp").innerText = val;
    });
}

// Funzione per leggere stato relè
function getRelay() {
  fetch(`${BLYNK_URL}get?token=${BLYNK_TOKEN}&V1`)
    .then(res => res.text())
    .then(val => {
      document.getElementById("relay").innerText = val == 1 ? "Accesa" : "Spenta";
    });
}

// Imposta setpoint temperatura (V3)
function setSetpoint() {
  let val = parseFloat(document.getElementById("setpoint").value);
  fetch(`${BLYNK_URL}update?token=${BLYNK_TOKEN}&V3=${val}`);
}

// Eventi
document.getElementById("setBtn").addEventListener("click", setSetpoint);

// Aggiornamento dati ogni 2 secondi
setInterval(getTemp, 2000);
setInterval(getRelay, 2000);
</script>
</body>
</html>
