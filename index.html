<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Termostato Max Full</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; }
  input { width: 50px; }
  table { border-collapse: collapse; margin-bottom: 20px; }
  th, td { border: 1px solid #ccc; padding: 5px; text-align: center; }
</style>
</head>
<body>
<h1>Termostato PWA Avanzato con Fasce Orarie</h1>

<p>Temperatura: <span id="temp">?</span> °C</p>
<p>Stato relè: <span id="relay">?</span></p>

<button id="onBtn">Accendi</button>
<button id="offBtn">Spegni</button>

<h3>Setpoint manuale:</h3>
<input type="number" id="setpoint" value="22">
<button id="setBtn">Imposta</button>

<h3>Programmazione fasce orarie (V4-V27)</h3>
<table id="schedule">
  <tr>
    <th>Ora</th>
    <th>Setpoint °C</th>
  </tr>
</table>
<button id="sendSchedule">Invia Programma</button>

<canvas id="chartTemp" width="400" height="150"></canvas>

<script>
const BLYNK_TOKEN = "opRIBmiiafmHLZjaMQdMSD5GYr8HVoSH";
const BLYNK_URL = `https://blynk.cloud/external/api/`;

let tempHistory = [];

// --- Funzioni ---
function setRelay(value) {
  fetch(`${BLYNK_URL}update?token=${BLYNK_TOKEN}&V0=${value}`);
}

function setSetpoint(value) {
  fetch(`${BLYNK_URL}update?token=${BLYNK_TOKEN}&V3=${value}`);
}

function getRelay() {
  fetch(`${BLYNK_URL}get?token=${BLYNK_TOKEN}&V1`)
    .then(res => res.text())
    .then(val => document.getElementById("relay").innerText = val);
}

function getTemp() {
  fetch(`${BLYNK_URL}get?token=${BLYNK_TOKEN}&V2`)
    .then(res => res.text())
    .then(val => {
      document.getElementById("temp").innerText = val;
      tempHistory.push(parseFloat(val));
      if (tempHistory.length > 50) tempHistory.shift();
      updateChart();
    });
}

// --- Fasce orarie ---
const scheduleTable = document.getElementById('schedule');
for (let i=0; i<24; i++) {
  let row = scheduleTable.insertRow();
  let cell1 = row.insertCell(0);
  let cell2 = row.insertCell(1);
  cell1.innerText = `${i}:00`;
  cell2.innerHTML = `<input type="number" id="hour${i}" value="20" min="10" max="30">`;
}

function sendSchedule() {
  for (let i=0; i<24; i++) {
    let val = document.getElementById(`hour${i}`).value;
    fetch(`${BLYNK_URL}update?token=${BLYNK_TOKEN}&V${i+4}=${val}`);
  }
}

// --- Eventi bottoni ---
document.getElementById("onBtn").addEventListener("click", () => setRelay(1));
document.getElementById("offBtn").addEventListener("click", () => setRelay(0));
document.getElementById("setBtn").addEventListener("click", () => {
  let val = parseFloat(document.getElementById("setpoint").value);
  setSetpoint(val);
});
document.getElementById("sendSchedule").addEventListener("click", sendSchedule);

// --- Aggiornamento dati ---
setInterval(getRelay, 2000);
setInterval(getTemp, 2000);

// --- Chart.js ---
const ctx = document.getElementById('chartTemp').getContext('2d');
const chart = new Chart(ctx, {
    type: 'line',
    data: {
        labels: Array(50).fill(''),
        datasets: [{
            label: 'Temperatura (°C)',
            data: tempHistory,
            borderColor: 'red',
            fill: false,
            tension: 0.1
        }]
    },
    options: {
        animation: false,
        scales: { y: { beginAtZero: false } }
    }
});

function updateChart() {
    chart.data.datasets[0].data = tempHistory;
    chart.update();
}
</script>
</body>
</html>
